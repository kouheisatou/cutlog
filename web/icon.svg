<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="cutlog">
  <!--
    カセットテープ。白地に黒い線だけで描く。
    ・iOSのアイコンは角丸に切り抜かれるので、地は四角のまま塗り、外周に余白を空ける
    ・★リールを「窓の中」に納めるのが肝。丸を2つ並べただけだと顔に見えてしまう
    ・上にラベルの罫線、下に送り穴を置いて、カセットの部品の並びだと分かるようにする
  -->
  <rect width="1024" height="1024" fill="#ffffff"/>

  <g fill="none" stroke="#101012" stroke-width="26"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 本体 -->
    <rect x="132" y="248" width="760" height="528" rx="40"/>

    <!-- 上のラベル（貼り紙の罫線） -->
    <path d="M212 336h600M212 400h420"/>

    <!-- 窓。この中にリールが入る -->
    <rect x="212" y="452" width="600" height="212" rx="24"/>

    <!-- 左右のリールと軸（窓の中） -->
    <circle cx="352" cy="558" r="66"/>
    <circle cx="672" cy="558" r="66"/>
    <circle cx="352" cy="558" r="20"/>
    <circle cx="672" cy="558" r="20"/>

    <!-- リールのあいだに張られたテープ -->
    <path d="M418 538h188M418 578h188"/>

    <!-- 下の送り穴（左右2つ）。ここがあると、顔ではなく機械だと分かる -->
    <rect x="316" y="700" width="88" height="40" rx="14"/>
    <rect x="620" y="700" width="88" height="40" rx="14"/>
  </g>
</svg>
