<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="cutlog">
  <!--
    時間の軸を抽象にしたしるし。白地に細い線だけ。
    ・横一本が時間の流れ、縦の線が刻み。長い刻みと短い刻みで目盛りらしく見せる
    ・軸から立ち上がる線とその先の丸は、その時刻に記録があることを表す
    ・絵は canvas の半分ほどに収め、周りをたっぷり空ける
    ・線は 1024 に対して 12。色は真っ黒にせず、濃いめのグレー
    ・地は真っ白ではなく、白に寄せた薄いベージュ
  -->
  <rect width="1024" height="1024" fill="#f7f4ee"/>

  <g fill="none" stroke="#2e2f33" stroke-width="12"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 時間の軸 -->
    <path d="M254 592h516"/>

    <!-- 長い刻み（区切り） -->
    <path d="M254 488v160M512 488v160M770 488v160"/>

    <!-- 短い刻み（その間） -->
    <path d="M383 546v92M641 546v92"/>

    <!-- 軸から立ち上がる線。その時刻に記録があることを表す。
         上（丸まで）と下（刻みまで）を同じだけ空ける -->
    <path d="M383 468v44M641 429v83"/>
  </g>

  <g fill="#2e2f33">
    <circle cx="383" cy="427" r="13"/>
    <circle cx="641" cy="388" r="13"/>
  </g>
</svg>
