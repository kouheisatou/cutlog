<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="cutlog">
  <!--
    時間の軸を抽象にしたしるし。白地に細い黒の線だけ。
    ・横一本が時間の流れ、縦の線が区切り。|—|—|— の形そのもの
    ・部品を足さない。アイコンの大きさでは、線が数本あれば足りる
    ・線は 1024 に対して 18。小さくしても潰れない下限に近い細さ
  -->
  <rect width="1024" height="1024" fill="#ffffff"/>

  <g fill="none" stroke="#101012" stroke-width="18" stroke-linecap="round">
    <!-- 時間の軸 -->
    <path d="M160 512h704"/>

    <!-- 区切りの刻み -->
    <path d="M160 424v176M395 424v176M629 424v176M864 424v176"/>
  </g>
</svg>
