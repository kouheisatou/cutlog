<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)" />
<title>cutlog</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/styles.css?v=0.15.0" />
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute">
  <defs>
    <g id="i-base" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></g>
  </defs>
  <symbol id="ic-settings" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></g></symbol>
  <symbol id="ic-close" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></g></symbol>
  <symbol id="ic-flip" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-13.7-5.6L4 7.6"/><path d="M4 4v3.6h3.6"/><path d="M4 13a8 8 0 0 0 13.7 5.6L20 16.4"/><path d="M20 20v-3.6h-3.6"/></g></symbol>
  <symbol id="ic-back" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></g></symbol>
  <symbol id="ic-prev" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></g></symbol>
  <symbol id="ic-next" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6l6 6-6 6"/></g></symbol>
  <symbol id="ic-film" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14"/><path d="M7 5v14M17 5v14M3 12h4M17 12h4M3 8.5h4M17 8.5h4M3 15.5h4M17 15.5h4"/></g></symbol>
  <symbol id="ic-photo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13"/><circle cx="12" cy="12.5" r="3.4"/><path d="M8 6l1.4-2h5.2L16 6"/></g></symbol>
  <symbol id="ic-download" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M8 11l4 4 4-4M4 19h16"/></g></symbol>
  <symbol id="ic-share" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="6" r="2.4"/><circle cx="7" cy="12" r="2.4"/><circle cx="17" cy="18" r="2.4"/><path d="M9.2 10.9l5.7-3.4M9.2 13.1l5.7 3.4"/></g></symbol>
  <symbol id="ic-merge" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="6"/><rect x="3" y="14" width="7" height="6"/><path d="M10 7h4a3 3 0 0 1 3 3v1M10 17h4a3 3 0 0 0 3-3v-1"/><path d="M17 8l3 3-3 3"/></g></symbol>
  <symbol id="ic-trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></g></symbol>
  <symbol id="ic-copy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11"/><path d="M15 9V4H4v11h5"/></g></symbol>
  <symbol id="ic-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/></g></symbol>
  <symbol id="ic-plus" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></g></symbol>
  <symbol id="ic-move" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="15" y="5" width="6" height="14"/><path d="M3 12h11M10 8l4 4-4 4"/></g></symbol>
  <symbol id="ic-camera" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="1"/><circle cx="12" cy="12.5" r="3.6"/><path d="M8 6l1.4-2h5.2L16 6"/></g></symbol>
  <symbol id="ic-list" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></g></symbol>
  <symbol id="ic-grid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5"/><rect x="13.5" y="3" width="7.5" height="7.5"/><rect x="3" y="13.5" width="7.5" height="7.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5"/></g></symbol>
  <symbol id="ic-play" viewBox="0 0 24 24"><g fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></g></symbol>
  <symbol id="ic-pause" viewBox="0 0 24 24"><g fill="currentColor"><rect x="7" y="5.5" width="3.4" height="13"/><rect x="13.6" y="5.5" width="3.4" height="13"/></g></symbol>
  <symbol id="ic-eye" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="3"/></g></symbol>
  <symbol id="ic-eye-off" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 4l16 16"/><path d="M9.5 6.4A9.9 9.9 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3.3 3.9M6.6 8.2A17 17 0 0 0 2.5 12S6 18 12 18a9.6 9.6 0 0 0 3.2-.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></g></symbol>
  <symbol id="ic-sound" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/></g></symbol>
  <symbol id="ic-mute" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 10l4 4M20 10l-4 4"/></g></symbol>
  <symbol id="ic-expand" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></g></symbol>
  <symbol id="ic-comment" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></g></symbol>
  <symbol id="ic-pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></g></symbol>
  <symbol id="ic-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="6" y="11" width="12" height="9"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></g></symbol>
</svg>

<!-- ログ一覧（最上位の画面。作成・参加・各ログの招待コードもここ） -->
<div id="logsScreen" class="app" hidden>
  <header class="topbar">
    <div class="spacer"></div>
    <button id="logsSearchBtn" class="icon-btn" aria-label="ログを検索"><svg class="ic"><use href="#ic-search"/></svg></button>
    <button id="logsAddBtn" class="icon-btn" aria-label="ログを追加"><svg class="ic"><use href="#ic-plus"/></svg></button>
  </header>
  <main class="screen-body">
    <div id="logsFilterBar" class="filter-bar" hidden>
      <span class="tc" id="logsFilterText"></span>
      <button id="logsFilterClear" class="mini">解除</button>
    </div>
    <nav aria-label="ログ一覧">
      <div id="logsList" class="logs-list"></div>
    </nav>
  </main>
</div>

<!-- ログの画面（ログ一覧の1つ下） -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="ログ一覧へ戻る"><svg class="ic"><use href="#ic-back"/></svg></button>
    <nav id="logCrumbs" class="crumbs" aria-label="いまいる場所"></nav>
    <span id="logMeta" class="muted crumb-meta"></span>
    <div class="spacer"></div>
    <button id="logSettingsBtn" class="icon-btn" aria-label="このログの設定"><svg class="ic"><use href="#ic-settings"/></svg></button>
  </header>

  <main class="screen-body wide">
    <div class="list-toolbar">
      <input id="search" type="search" placeholder="メモを検索" />
      <select id="authorFilter"><option value="">全員</option></select>
      <select id="tagFilter" aria-label="タグで絞り込む" hidden><option value="">タグ</option></select>
    </div>
    <div id="listBody"></div>
  </main>
</div>

<!-- このログの設定（ログの1つ下）。ログに関わることは全部ここに集める。 -->
<div id="logSetScreen" class="app" hidden>
  <header class="topbar">
    <button id="logSetBack" class="icon-btn" aria-label="ログへ戻る"><svg class="ic"><use href="#ic-back"/></svg></button>
    <nav id="logSetCrumbs" class="crumbs" aria-label="いまいる場所"></nav>
  </header>
  <main class="screen-body">
    <div class="panel-row">
      <label>タイトル<input id="logSetName" maxlength="80" /></label>
    </div>
    <div class="panel-row">
      <label>1クリップの長さ<input id="logSetSeconds" type="number" min="1" max="30" step="1" /></label>
      <span class="muted small">秒</span>
    </div>
    <div class="panel-row">
      <label class="check"><input type="checkbox" id="logSetDefault" /> デフォルトでこのログに保存する</label>
    </div>
    <div class="panel-row">
      <button id="logSetSave" class="btn primary">保存</button>
    </div>

    <h2 class="section-head"><span>招待</span></h2>
    <div class="panel-row" id="logSetInviteRow">
      <span class="tc" id="logSetInvite"></span>
      <button id="logSetCopyInvite" class="mini"><svg class="ic sm"><use href="#ic-copy"/></svg>コピー</button>
      <button id="logSetRotate" class="mini">再生成</button>
    </div>

    <h2 class="section-head"><span>参加者</span><span id="logSetMemberCount" class="muted"></span></h2>
    <div id="logSetMembers" class="member-list"></div>

    <h2 class="section-head"><span>共有リンク</span></h2>
    <div class="panel-row">
      <button id="shareLinksBtn" class="btn"><svg class="ic sm"><use href="#ic-share"/></svg>共有リンクの一覧</button>
    </div>

    <h2 class="section-head"><span>ゴミ箱</span></h2>
    <div class="panel-row">
      <button id="logSetTrash" class="btn"><svg class="ic sm"><use href="#ic-trash"/></svg>削除したカットを表示</button>
    </div>
    <div id="logSetTrashList" class="trash-list"></div>
  </main>
</div>

<!-- その日の詳細（ログのカレンダーの1つ下）。つないだ再生がここの主役。 -->
<div id="dayScreen" class="app" hidden>
  <header class="topbar">
    <button id="dayBack" class="icon-btn" aria-label="カレンダーへ戻る"><svg class="ic"><use href="#ic-back"/></svg></button>
    <nav id="dayCrumbs" class="crumbs" aria-label="いまいる場所"></nav>
    <div class="spacer"></div>
    <button id="dayPrevDay" class="icon-btn" aria-label="前の日"><svg class="ic"><use href="#ic-prev"/></svg></button>
    <button id="dayNextDay" class="icon-btn" aria-label="次の日"><svg class="ic"><use href="#ic-next"/></svg></button>
  </header>

  <main class="body">
    <aside class="list-pane">
      <!-- つないだ再生：その日のクリップを1本の動画のように続けて出す（作り直しはしない） -->
      <div class="player" id="player">
        <div class="stage" id="pvStage">
          <video id="pvA" playsinline preload="auto"></video>
          <video id="pvB" playsinline preload="auto"></video>
          <img id="pvImg" alt="" hidden />
          <div class="stage-empty" id="pvEmpty">この日に表示できるクリップがありません</div>
          <button class="stage-tap" id="pvTap" aria-label="再生・一時停止"></button>
          <div class="stage-overlay" aria-hidden="true">
            <span class="ov ov-left" id="ovLog"></span>
            <span class="ov ov-center" id="ovNote"></span>
            <span class="ov ov-right" id="ovTime"></span>
          </div>
          <div class="stage-badge" id="pvBadge"></div>
        </div>
        <div class="scrub" id="pvScrub" role="slider" aria-label="再生位置" tabindex="0"
             aria-valuemin="0" aria-valuenow="0" aria-valuemax="0">
          <div class="segs" id="pvSegs"></div>
          <div class="head" id="pvHead"></div>
        </div>
        <div class="controls">
          <button id="pvPlay" class="icon-btn" aria-label="再生"><svg class="ic"><use href="#ic-play"/></svg></button>
          <button id="pvPrevClip" class="icon-btn" aria-label="前のクリップ"><svg class="ic"><use href="#ic-prev"/></svg></button>
          <button id="pvNextClip" class="icon-btn" aria-label="次のクリップ"><svg class="ic"><use href="#ic-next"/></svg></button>
          <span class="tc" id="pvClock">0:00 / 0:00</span>
          <div class="spacer"></div>
          <button id="pvMute" class="icon-btn" aria-label="音を消す"><svg class="ic"><use href="#ic-sound"/></svg></button>
          <button id="pvFull" class="icon-btn" aria-label="大きく見る"><svg class="ic"><use href="#ic-expand"/></svg></button>
        </div>
      </div>

      <div class="day-bar">
        <div class="spacer"></div>
        <button id="dayExport" class="mini primary"><svg class="ic sm"><use href="#ic-download"/></svg>書き出し</button>
        <button id="dayShare" class="mini"><svg class="ic sm"><use href="#ic-share"/></svg>共有</button>
        <button id="dayRender" class="mini"><svg class="ic sm"><use href="#ic-merge"/></svg>動画を保存</button>
      </div>

      <div id="dayList" class="day-list"></div>
    </aside>

  </main>
</div>

<!-- 全カット（ログをまたいで、撮ったもの全部を新しい順に見る） -->
<div id="allScreen" class="app" hidden>
  <header class="topbar">
    <nav id="allCrumbs" class="crumbs" aria-label="いまいる場所"></nav>
    <div class="spacer"></div>
    <button id="allSearchBtn" class="icon-btn" aria-label="メモを検索"><svg class="ic"><use href="#ic-search"/></svg></button>
    <label class="icon-btn" id="allAddBtn" title="端末の動画から取り込む">
      <svg class="ic"><use href="#ic-plus"/></svg>
      <span class="sr">端末の動画から取り込む</span>
      <input id="allAddInput" type="file" accept="video/*" multiple hidden />
    </label>
  </header>
  <main class="body">
    <aside id="allPane" class="list-pane">
      <div id="allFilterBar" class="filter-bar" hidden>
        <span class="tc" id="allFilterText"></span>
        <button id="allFilterClear" class="mini">解除</button>
      </div>
      <div id="allBody" class="list-body"></div>
    </aside>
  </main>
</div>

<!-- ログイン -->
<div id="authScreen" class="auth" hidden>
  <div class="auth-card">
    <h1 class="brand">cutlog</h1>
    <p class="muted" id="instanceName"></p>
    <div id="oidcBox" hidden>
      <a id="oidcBtn" class="btn primary block" href="/api/auth/oidc/start">シングルサインオンでログイン</a>
      <div class="divider"><span>または</span></div>
    </div>
    <div id="localBox">
      <div class="tabs">
        <button id="tabLogin" class="tab active">ログイン</button>
        <button id="tabSignup" class="tab">新規登録</button>
      </div>
      <form id="authForm" class="form">
        <label>ユーザー名<input name="username" autocomplete="username" required /></label>
        <label id="displayNameField" hidden>表示名<input name="displayName" autocomplete="name" /></label>
        <label>パスワード<input name="password" type="password" autocomplete="current-password" required /></label>
        <p id="authError" class="error" hidden></p>
        <button class="btn primary block" type="submit">ログイン</button>
      </form>
    </div>
  </div>
</div>

<!-- 撮影 -->
<dialog id="captureDialog" class="sheet">
  <div class="capture">
    <video id="preview" playsinline muted autoplay></video>
    <canvas id="snapCanvas" hidden></canvas>
    <video id="playback" playsinline controls hidden></video>
    <div class="capture-top">
      <button id="closeCapture" class="icon-btn light" aria-label="閉じる"><svg class="ic"><use href="#ic-close"/></svg></button>
      <div class="chip" id="capTimer">3秒</div>
      <button id="flipCam" class="icon-btn light" aria-label="カメラを切り替える"><svg class="ic"><use href="#ic-flip"/></svg></button>
    </div>
    <button type="button" class="cap-dest" id="capDest"></button>
    <div class="zoom-wrap" id="zoomWrap" hidden>
      <div class="zoom-stops" id="zoomStops"></div>
      <div class="zoom-slider">
        <input id="zoomRange" type="range" aria-label="ズーム" min="1" max="4" step="0.1" value="1" />
        <span class="chip" id="zoomNow">1×</span>
      </div>
    </div>
    <div class="capture-bottom">
      <label class="chip file">
        ファイルから選択<input id="fileInput" type="file" accept="video/*" hidden />
      </label>
      <button id="shootBtn" class="shutter" aria-label="撮る"><span class="dot"></span></button>
      <span class="chip ghost">動画</span>
    </div>
    <div id="reviewBar" class="review-bar" hidden>
      <button id="retakeBtn" class="btn">撮り直し</button>
      <input id="noteInput" placeholder="ひとこと（任意）" />
      <button id="saveCutBtn" class="btn primary">保存</button>
    </div>
  </div>
</dialog>

<!-- この撮影の記録先（撮影のたびに開いているログへ戻る） -->
<dialog id="destDialog" class="sheet">
  <div class="panel">
    <button type="button" class="panel-close icon-btn" data-close aria-label="閉じる"><svg class="ic"><use href="#ic-close"/></svg></button>
    <h2>この撮影の記録先</h2>
    <div id="destList" class="move-list"></div>
    <div class="panel-actions">
      <button id="destCancel" class="btn">キャンセル</button>
    </div>
  </div>
</dialog>

<!-- 書き出し / 共有 -->
<dialog id="exportDialog" class="sheet">
  <form method="dialog" class="panel">
    <button type="button" class="panel-close icon-btn" data-close aria-label="閉じる"><svg class="ic"><use href="#ic-close"/></svg></button>
    <h2 id="exportTitle">書き出し</h2>
    <div class="pick-head">
      <span class="tc" id="pickCount"></span>
      <div class="spacer"></div>
      <button type="button" id="pickAll" class="mini">すべて選択</button>
      <button type="button" id="pickNone" class="mini">すべて解除</button>
    </div>
    <div id="exportList" class="pick-list"></div>
    <div class="panel-row" id="exportOptions">
      <label class="check"><input type="checkbox" id="withMeta" checked /> 撮影日時などの一覧表（cuts.json / cuts.csv）も入れる</label>
    </div>
    <div class="panel-row" id="shareOptions" hidden>
      <label>タイトル<input id="shareTitle" placeholder="例: 8月の記録" /></label>
      <label>有効期限<input id="shareExpires" type="date" /></label>
      <label>パスワード<input id="sharePassword" type="password" placeholder="任意" /></label>
      <label class="check"><input type="checkbox" id="allowDownload" checked /> 見た人が端末に保存できるようにする</label>
    </div>
    <div id="renderOptions" hidden>
      <div class="pv-wrap" id="pvWrap">
        <figure class="pv" id="pvTitleFig" hidden>
          <div class="pv-frame" id="pvTitleFrame"><span id="pvTitleText"></span></div>
          <figcaption>表紙</figcaption>
        </figure>
        <figure class="pv">
          <div class="pv-frame" id="pvMainFrame">
            <span class="pv-text" id="pvTime" hidden></span>
            <span class="pv-text" id="pvNote" hidden></span>
          </div>
          <figcaption>本編</figcaption>
        </figure>
      </div>
      <button type="button" id="advToggle" class="adv-toggle" aria-expanded="false">詳しい設定を出す</button>
      <div id="advBox" hidden>
      <h3>画面</h3>
      <div class="panel-row">
        <label>サイズ<select id="stSize">
          <option value="landscape">横 1280×720</option>
          <option value="portrait">縦 720×1280</option>
          <option value="square">正方形 1080×1080</option>
          <option value="custom">自由</option>
        </select></label>
        <label id="stWLabel" hidden>幅<input id="stW" type="number" min="240" max="2160" step="2" /></label>
        <label id="stHLabel" hidden>高さ<input id="stH" type="number" min="240" max="3840" step="2" /></label>
      </div>
      <div class="panel-row">
        <label>表示方法<select id="stFit">
          <option value="contain">全体を入れる（余白が付く）</option>
          <option value="cover">画面いっぱいに切り抜く</option>
        </select></label>
        <label>背景色<input id="stBg" type="color" /></label>
        <label>fps<input id="stFps" type="number" min="10" max="60" /></label>
      </div>
      <h3>長さと並び</h3>
      <div class="panel-row">
        <label class="check"><input type="checkbox" id="stTrim" /> 1カットの長さを揃える</label>
        <label id="stPerLabel" hidden>秒数<input id="stPer" type="number" min="0.5" max="60" step="0.5" /></label>
      </div>
      <div class="panel-row">
        <label>写真1枚の秒数<input id="stPhoto" type="number" min="0.3" max="15" step="0.1" /></label>
        <label>並び順<select id="stOrder">
          <option value="time">撮った順</option>
          <option value="reverse">新しい順</option>
        </select></label>
      </div>
      <h3>時刻</h3>
      <div class="panel-row">
        <label class="check"><input type="checkbox" id="stTimeShow" /> 撮影時刻を焼き込む</label>
      </div>
      <div id="stTimeOpts" hidden>
        <div class="panel-row">
          <label>書式<select id="stTimeFormat"></select></label>
          <label>位置<select id="stTimePos"></select></label>
          <label>文字サイズ<input id="stTimeSize" type="number" min="12" max="160" /></label>
          <label>文字色<input id="stTimeColor" type="color" /></label>
        </div>
        <div class="panel-row">
          <label class="check"><input type="checkbox" id="stTimeBox" /> 文字背景</label>
          <label>文字背景の色<input id="stTimeBoxColor" type="color" /></label>
          <label>文字背景の濃さ<input id="stTimeBoxOp" type="range" min="0" max="1" step="0.05" /></label>
        </div>
      </div>
      <h3>メモ</h3>
      <div class="panel-row">
        <label class="check"><input type="checkbox" id="stNoteShow" /> メモを焼き込む</label>
      </div>
      <div id="stNoteOpts" hidden>
        <div class="panel-row">
          <label>位置<select id="stNotePos"></select></label>
          <label>文字サイズ<input id="stNoteSize" type="number" min="12" max="160" /></label>
          <label>文字色<input id="stNoteColor" type="color" /></label>
        </div>
        <div class="panel-row">
          <label class="check"><input type="checkbox" id="stNoteBox" /> 文字背景</label>
          <label>文字背景の色<input id="stNoteBoxColor" type="color" /></label>
          <label>文字背景の濃さ<input id="stNoteBoxOp" type="range" min="0" max="1" step="0.05" /></label>
        </div>
      </div>
      <h3>表紙</h3>
      <div class="panel-row">
        <label class="check"><input type="checkbox" id="stTitleShow" /> 先頭に表紙を付ける</label>
      </div>
      <div id="stTitleOpts" hidden>
        <div class="panel-row">
          <label>文言<input id="stTitleText" maxlength="60" /></label>
          <label>秒数<input id="stTitleSec" type="number" min="1" max="10" /></label>
        </div>
        <div class="panel-row">
          <label>文字サイズ<input id="stTitleSize" type="number" min="16" max="200" /></label>
          <label>文字色<input id="stTitleColor" type="color" /></label>
          <label>背景色<input id="stTitleBg" type="color" /></label>
        </div>
      </div>
      </div>
    </div>
    <div class="panel-actions">
      <button value="cancel" class="btn">キャンセル</button>
      <button id="exportGo" value="ok" class="btn primary">書き出し</button>
    </div>
  </form>
</dialog>

<!-- カットの移動 -->
<dialog id="moveDialog" class="sheet">
  <form method="dialog" class="panel">
    <button type="button" class="panel-close icon-btn" data-close aria-label="閉じる"><svg class="ic"><use href="#ic-close"/></svg></button>
    <h2>カットの移動</h2>
    <p class="muted small" id="moveNote">移動したカットは、移動元のログで作成した共有リンクから外れます。</p>
    <div id="moveList" class="move-list"></div>
    <div id="moveResult" class="move-result" hidden></div>
    <div class="panel-actions">
      <button value="cancel" class="btn" id="moveCancel">キャンセル</button>
      <button id="moveGo" value="ok" class="btn primary">移動</button>
    </div>
  </form>
</dialog>

<!-- マップ（撮った場所を地図の上に出す） -->
<div id="mapScreen" class="app" hidden>
  <main class="body full">
    <aside class="list-pane">
      <div class="map-host" id="mapHost">
        <div class="map-tiles" id="mapTiles"></div>
        <div class="map-pins" id="mapPins"></div>
        <div class="map-empty" id="mapEmpty" hidden>位置情報のあるカットがまだありません。</div>
        <div class="map-credit" id="mapCredit"></div>
        <div class="map-count" id="mapCount"></div>
      </div>
    </aside>
  </main>
</div>

<!-- マップで押した場所のカット（マップの1つ下） -->
<div id="mapListScreen" class="app" hidden>
  <header class="topbar">
    <button id="mapListBack" class="icon-btn" aria-label="マップへ戻る"><svg class="ic"><use href="#ic-back"/></svg></button>
    <nav id="mapListCrumbs" class="crumbs" aria-label="いまいる場所"></nav>
  </header>
  <main class="body">
    <aside class="list-pane">
      <div id="mapListBody" class="list-body"></div>
    </aside>
  </main>
</div>

<!-- 設定（ログ一覧と並ぶ画面。既定の記録先・撮影リマインダー・アカウントだけ） -->
<div id="settingsScreen" class="app" hidden>
  <main class="screen-body top">
    <section>
      <h2>撮影リマインダー</h2>
      <div class="panel-row">
        <select id="remMode" aria-label="通知のしかた">
          <option value="off">通知しない</option>
          <option value="hourly">毎時ちょうどに通知する</option>
          <option value="times">決めた時刻に通知する</option>
          <option value="random">ランダムな時刻に通知する</option>
        </select>
        <input id="remTimes" placeholder="09:00,12:00,18:00" aria-label="通知する時刻（カンマ区切り）" hidden />
      </div>
      <div class="panel-row" id="remWindow" hidden>
        <label>何時から<input id="remFrom" type="number" min="0" max="23" value="9" /></label>
        <label>何時まで<input id="remTo" type="number" min="0" max="23" value="22" /></label>
        <label id="remPerLabel">1日の回数<input id="remPer" type="number" min="1" max="24" value="6" /></label>
      </div>
      <div class="panel-row">
        <button id="saveReminder" class="btn">保存</button>
        <button id="enablePush" class="btn">許可</button>
        <button id="testPush" class="btn">テスト送信</button>
      </div>
      <p class="muted small" id="pushHint"></p>
    </section>
    <section>
      <h2>アカウント</h2>
      <div class="panel-row avatar-row">
        <span class="avatar lg" id="myAvatar"></span>
        <label class="btn" id="avatarPick">
          アイコン画像を設定<input id="avatarInput" type="file" accept="image/*" hidden />
        </label>
        <button id="avatarClear" class="btn">削除</button>
      </div>
      <div class="panel-row">
        <span id="whoami" class="muted"></span>
        <div class="spacer"></div>
        <button id="logoutBtn" class="btn">ログアウト</button>
      </div>
    </section>
  </main>
</div>

<!-- このログの共有リンクの一覧（ログの1つ下） -->
<dialog id="shareLinksDialog" class="sheet">
  <div class="panel">
    <button type="button" class="panel-close icon-btn" data-close aria-label="閉じる"><svg class="ic"><use href="#ic-close"/></svg></button>
    <h2>共有リンク</h2>
    <div id="shareList" class="share-list"></div>
    <div class="panel-actions">
      <button id="closeShareLinks" class="btn primary">閉じる</button>
    </div>
  </div>
</dialog>

<!-- 下のタブバー（カメラ・ログ・全カット） -->
<nav id="tabbar" class="tabbar" aria-label="画面の切り替え" hidden>
  <button class="tab-item" data-tab="camera" type="button">
    <svg class="ic"><use href="#ic-camera"/></svg><span>カメラ</span>
  </button>
  <button class="tab-item" data-tab="all" type="button">
    <svg class="ic"><use href="#ic-grid"/></svg><span>カット一覧</span>
  </button>
  <button class="tab-item" data-tab="logs" type="button" aria-current="page">
    <svg class="ic"><use href="#ic-list"/></svg><span>ログ</span>
  </button>
  <button class="tab-item" data-tab="map" type="button">
    <svg class="ic"><use href="#ic-pin"/></svg><span>マップ</span>
  </button>
  <button class="tab-item" data-tab="settings" type="button">
    <svg class="ic"><use href="#ic-settings"/></svg><span>設定</span>
  </button>
</nav>

<!-- クリップの詳細（どの画面からも、同じモーダルで開く） -->
<dialog id="cutDialog" class="sheet">
  <div class="panel wide-panel">
    <button type="button" class="panel-close icon-btn" data-close aria-label="閉じる"><svg class="ic"><use href="#ic-close"/></svg></button>
    <div id="detail"></div>
  </div>
</dialog>

<!-- コメント（その日のクリップの並びから開く） -->
<dialog id="commentDialog" class="sheet">
  <div class="panel">
    <button type="button" class="panel-close icon-btn" data-close aria-label="閉じる"><svg class="ic"><use href="#ic-close"/></svg></button>
    <h2 id="commentTitle">コメント</h2>
    <div id="commentList" class="comments"></div>
    <div class="panel-row">
      <input id="commentBox" placeholder="コメントを書く" autocomplete="off" />
      <button id="commentSend" class="btn primary">送信</button>
    </div>
  </div>
</dialog>

<!-- ログの追加（ログ一覧の右上から開く） -->
<dialog id="logAddDialog" class="sheet">
  <div class="panel">
    <button type="button" class="panel-close icon-btn" data-close aria-label="閉じる"><svg class="ic"><use href="#ic-close"/></svg></button>
    <h2>ログを追加</h2>
    <h3>新しく作る</h3>
    <div class="panel-row">
      <input id="newLogName" placeholder="ログのタイトル" autocomplete="off" />
      <button id="createLog" class="btn primary">作成</button>
    </div>
    <h3>招待コードで参加する</h3>
    <div class="panel-row">
      <input id="joinCode" placeholder="招待コード" autocomplete="off" />
      <button id="joinLog" class="btn">参加</button>
    </div>
  </div>
</dialog>

<!-- ログの検索（ログ一覧の右上から開く） -->
<dialog id="logSearchDialog" class="sheet">
  <div class="panel">
    <button type="button" class="panel-close icon-btn" data-close aria-label="閉じる"><svg class="ic"><use href="#ic-close"/></svg></button>
    <h2>ログを検索</h2>
    <div class="panel-row">
      <label>タイトル<input id="logsSearch" type="search" placeholder="ログのタイトルを入力してください" autocomplete="off" /></label>
    </div>
    <div class="panel-actions">
      <button id="logsSearchClear" class="btn">絞り込みをリセット</button>
      <button id="logsSearchGo" class="btn primary">検索</button>
    </div>
  </div>
</dialog>

<!-- 検索（カット一覧から開く） -->
<dialog id="searchDialog" class="sheet">
  <div class="panel">
    <button type="button" class="panel-close icon-btn" data-close aria-label="閉じる"><svg class="ic"><use href="#ic-close"/></svg></button>
    <h2>検索</h2>
    <div class="panel-row">
      <label>メモ<input id="allSearch" type="search" placeholder="メモのワードを入力してください" autocomplete="off" /></label>
    </div>
    <div class="panel-row">
      <label>アップロードした人<select id="allAuthor"><option value="">全員</option></select></label>
    </div>
    <div class="panel-actions">
      <button id="searchClear" class="btn">絞り込みをリセット</button>
      <button id="searchGo" class="btn primary">検索</button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/app.js?v=0.15.0"></script>
</body>
</html>
