name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-sqlite:
    name: テスト（SQLite）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test

  test-postgres:
    name: テスト（PostgreSQL）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cutlog
          POSTGRES_PASSWORD: cutlog
          POSTGRES_DB: cutlog
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cutlog" --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      DB_DRIVER: postgres
      DATABASE_URL: postgres://cutlog:cutlog@localhost:5432/cutlog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test

  docker:
    name: Dockerイメージが建つか
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cutlog:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
