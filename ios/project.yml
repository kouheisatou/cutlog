# XcodeGen の定義。GUI を使わずに .xcodeproj を作り直せるようにしてある。
#   brew install xcodegen && ./scripts/generate.sh
# 生成物の CutlogShell.xcodeproj も追跡しているので、
# XcodeGen が無い環境でも xcodebuild 単体でビルドできる。
name: CutlogShell

options:
  bundleIdPrefix: dev.cutlog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # Xcode 26 の既定は Swift 6 の厳格な並行性で、殻としては過剰に厳しい。
    # 5 に固定して、環境差で CLI ビルドが壊れないようにする。
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # BuildConfig を作る Run Script が、リポジトリのルート（SRCROOT の外）にある
    # native.env を読む必要がある。サンドボックスを有効にすると読めないため切る。
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  CutlogShell:
    type: application
    platform: iOS
    sources:
      - path: CutlogShell
    preBuildScripts:
      - name: native.env から BuildConfig.swift を作る
        script: |
          "$SRCROOT/scripts/generate-build-config.sh"
        # 出力を宣言しておくと、変化が無いビルドで走らずに済む。
        # 入力に native.env は入れない（無い環境では example に落ちるため、
        # ファイルが存在しないとビルドが失敗してしまう）。
        outputFiles:
          - $(SRCROOT)/CutlogShell/Generated/BuildConfig.swift
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cutlog.shell
        PRODUCT_NAME: cutlog
        INFOPLIST_FILE: CutlogShell/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: NO
